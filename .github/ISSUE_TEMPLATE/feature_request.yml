name: Feature request
description: Suggest a new command or scenario
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: plan
    attributes:
      label: Tilda plan
      options:
        - Free
        - Personal
        - Business
        - Not sure
    validations:
      required: true
